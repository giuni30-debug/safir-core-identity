<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline — Safir Private Life</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100dvh;
        background: radial-gradient(ellipse at top, #0e1820 0%, #050608 60%);
        color: #f5f9fb;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid; place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .card {
        max-width: 22rem; margin: 1rem; padding: 2.25rem;
        border-radius: 1.75rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.10);
        backdrop-filter: blur(24px) saturate(140%);
        text-align: center;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #22d3ee, #67e8f9);
        color: #001018; font-weight: 700; font-size: 28px;
        box-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.5; color: rgba(245, 249, 251, 0.65); }
      button {
        margin-top: 1.5rem; width: 100%; padding: 0.75rem 1rem;
        border: 0; border-radius: 1rem;
        background: #22d3ee; color: #001018;
        font-weight: 600; font-size: 0.875rem; cursor: pointer;
        box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
        transition: opacity 0.2s;
      }
      button:hover { opacity: 0.9; }
      .accent { color: #22d3ee; text-shadow: 0 0 12px rgba(34, 211, 238, 0.5); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">S</div>
      <h1><span class="accent">You're offline</span></h1>
      <p>Safir needs a connection to load right now. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
